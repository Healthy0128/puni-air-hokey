name: Hotfix audio constructor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace('class Audio{','class GameAudio{',1)
          s=s.replace("const a=new Audio('./assets/audio/bgm/mahou-no-cooking.mp3')","const a=new window.Audio('./assets/audio/bgm/mahou-no-cooking.mp3')",1)
          s=s.replace('const A=new Audio();','const A=new GameAudio();',1)
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet -- app.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- app.js
          git commit -m "Fix START crash from Audio constructor shadowing"
          git push
